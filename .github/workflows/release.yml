name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the release and push release.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify version consistency
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          JSON_VERSION=$(jq -r '.version' src/module.json)
          if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != module.json version ($JSON_VERSION)"
            exit 1
          fi

      - name: Build (Docker cross-compile ARM64)
        run: ./scripts/build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/concat-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/download/v$VERSION/concat-module.tar.gz"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A tag build has no local main: fetch it, switch, THEN write release.json
          # (a forced checkout after writing would throw the new file away).
          git fetch origin main
          git checkout -B main origin/main
          echo "{\"version\": \"$VERSION\", \"download_url\": \"$URL\"}" > release.json
          git add release.json
          git commit -m "chore: update release.json for v$VERSION [skip ci]"
          git push origin main
